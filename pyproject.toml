# Documents the inference environment created on the remote machine (agd):
# .venv with CPython 3.11, resolved against PyPI + the PyTorch cu128 index.
# Recreate with `uv sync` (or `uv sync --frozen` to install exactly uv.lock).
[project]
name = "kvae"
version = "0.1.0"
description = "KVAE: audio, image, and video tokenizers — inference environment"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchmetrics==1.8.2",
    "torchcodec==0.6.0",
    "torchaudio==2.8.0",
    "dill==0.4.1",
    "multiprocess==0.70.19",
    "diffusers",
    "huggingface-hub",
    "safetensors",
    "omegaconf",
    "einops",
    "numpy==1.26.4",
    "pandas==3.0.1",
    "opencv-python",
    "pillow",
    "regex",
    "requests",
    "tqdm",
    "ipykernel",
    "matplotlib",
    "argbind>=0.3.7",
    "descript-audiotools>=0.7.2",
    "soundfile",
    "pesq",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# The repo is not an installable package (no build config); scripts run as
# `python -m scripts.<name>` from the repo root.
package = false
# The environment targets the linux/CUDA remote machine only — cu128 wheels
# do not exist for other platforms.
environments = ["sys_platform == 'linux'"]

# CUDA 12.8 builds of the torch family come from the PyTorch index; `explicit`
# keeps every other package on PyPI (avoids the index-shadowing failure that
# `--extra-index-url` + torchmetrics hits, see CLAUDE.md).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
torchcodec = [{ index = "pytorch-cu128" }]
